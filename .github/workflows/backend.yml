name: Backend

on:
  push:
    branches: [main, dev]
    paths:
      - backend/**
      - infra/**
      - docs/backend-api-contract.md
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - backend/**
      - infra/**
      - docs/backend-api-contract.md
      - .github/workflows/backend.yml
  schedule:
    # Toda segunda: vulnerabilidades novas aparecem mesmo sem mudança no código.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend/readowl

jobs:
  verify:
    name: Testes e JAR de produção
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: readowl
          # Banco descartável, que só existe durante este job.
          POSTGRES_PASSWORD: readowl-ci
          POSTGRES_DB: readowl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readowl -d readowl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      READOWL_TEST_DB_URL: jdbc:postgresql://localhost:5432/readowl_test
      READOWL_TEST_DB_USER: readowl
      READOWL_TEST_DB_PASSWORD: readowl-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Testes de unidade e de integração, com relatório de cobertura
        run: sh ./mvnw --batch-mode --no-transfer-progress verify -Pcoverage
      - name: JAR de produção
        env:
          DB_ADMIN_USER: readowl
          DB_ADMIN_PASSWORD: readowl-ci
        run: sh scripts/smoke-test.sh
      - name: Guardar os relatórios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-de-teste
          path: |
            backend/readowl/target/surefire-reports
            backend/readowl/target/failsafe-reports
            backend/readowl/target/site/jacoco
          retention-days: 14

  homologation:
    name: Imagem, Compose e NGINX
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Subir o ambiente a partir do repositório
        run: sh infra/homolog.sh up
      - name: Conferir usuários, permissões, proxy e e-mail
        run: sh infra/homolog.sh check
      - name: Fazer um backup e restaurá-lo
        run: sh infra/homolog.sh drill
      - name: Mostrar os logs
        if: failure()
        run: sh infra/homolog.sh logs
      - name: Remover o ambiente
        if: always()
        run: sh infra/homolog.sh destroy

  dependencies:
    name: Vulnerabilidades em dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            scan
            source
            --recursive
            backend/readowl

  testcontainers:
    name: Testes com Testcontainers
    # Só sob demanda e toda semana: confere o caminho para quem não tem um banco local. Sobe um contêiner por contexto
    # do Spring, então é lento demais para cada Pull Request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: sh ./mvnw --batch-mode --no-transfer-progress verify
