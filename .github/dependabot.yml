version: 2
updates:
  # O Bouncy Castle e o SDK do S3 são as únicas versões fixadas no POM. As demais vêm do Spring Boot, atualizado como um todo.
  - package-ecosystem: maven
    directory: /backend/readowl
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # As imagens têm versão e digest fixos, e só mudam por aqui.
  - package-ecosystem: docker
    directory: /backend/readowl
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directory: /infra
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
