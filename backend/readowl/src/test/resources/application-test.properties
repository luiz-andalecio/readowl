spring.config.import=optional:file:.env[.properties]

# Vazios quando o banco vem do Testcontainers (ver TestDatabaseConfiguration).
spring.datasource.url=${READOWL_TEST_DB_URL:}
spring.datasource.username=${READOWL_TEST_DB_USER:}
spring.datasource.password=${READOWL_TEST_DB_PASSWORD:}

spring.flyway.clean-disabled=false

server.servlet.session.cookie.secure=false
