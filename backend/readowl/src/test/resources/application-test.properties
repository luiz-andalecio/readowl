spring.config.import=optional:file:.env[.properties]

# Vazios quando o banco vem do Testcontainers (ver TestDatabaseConfiguration).
spring.datasource.url=${READOWL_TEST_DB_URL:}
spring.datasource.username=${READOWL_TEST_DB_USER:}
spring.datasource.password=${READOWL_TEST_DB_PASSWORD:}

spring.flyway.clean-disabled=false

APP_PUBLIC_URL=https://readowl.test
MAIL_FROM=no-reply@readowl.test
# Nao recebe conexoes: os testes substituem o JavaMailSender (ver RecordingMailSender).
SMTP_HOST=localhost
SMTP_PORT=2525
# Os testes substituem o armazenamento (ver RecordingObjectStorage).
S3_PUBLIC_URL=https://cdn.readowl.test

server.servlet.session.cookie.secure=false

# Os testes acionam o worker diretamente, para saber quando ele rodou.
readowl.notifications.poll-interval=PT1H
