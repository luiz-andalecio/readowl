spring.application.name=readowl

# Sem valores padrao de proposito: fora do perfil dev, a aplicacao nao inicia sem configuracao explicita.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}&sslrootcert=${DB_SSL_ROOT_CERT:}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Sem o detalhe do erro do PostgreSQL, que traz os valores em conflito, como e-mails, para os logs.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# Sem conexao livre, responde logo em vez de prender a requisicao por 30 s.
spring.datasource.hikari.connection-timeout=5000
# Uma consulta lenta ou uma transacao esquecida nao podem segurar uma conexao indefinidamente.
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=30s -c idle_in_transaction_session_timeout=60s

readowl.public-url=${APP_PUBLIC_URL}
readowl.mail-from=${MAIL_FROM}
readowl.notifications.poll-interval=PT15S
# Cada hash de senha usa 19 MiB: limita o uso de memoria durante um ataque ao login.
readowl.max-concurrent-password-hashes=16
# Cotas altas, para acomodar romances longos. Protegem o disco contra abuso, nao limitam o uso normal.
readowl.limits.books-per-account=50
readowl.limits.volumes-per-book=200
readowl.limits.chapters-per-book=5000
readowl.limits.revisions-per-chapter=500
# Texto de capitulos, em rascunhos e revisoes, ja comprimido pelo banco: 2 GiB.
readowl.limits.stored-bytes-per-account=2147483648

# O schema pertence ao Flyway: o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Quem recebe as permissoes depois de cada migrate (ver db/migration/afterMigrate.sql).
spring.flyway.placeholders.appUser=${spring.datasource.username}

spring.session.jdbc.initialize-schema=never
spring.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
readowl.csrf-cookie-name=XSRF-TOKEN

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Envio de e-mail: fila limitada para um SMTP lento nao consumir memoria sem controle.
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=200
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=20s
# As tarefas agendadas nao ficam presas atras de um envio de e-mail lento.
spring.task.scheduling.pool.size=2

# Nenhuma rota recebe formulários de arquivos: a foto de perfil chega como corpo binário, com tamanho limitado.
spring.servlet.multipart.enabled=false

# Mensagens de validacao em portugues, independentemente do navegador.
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Uma falha no SMTP nao torna a aplicacao indisponivel.
management.health.mail.enabled=false
# Sem banco, a instancia deixa de receber trafego, mas nao reinicia.
management.endpoint.health.group.readiness.include=readinessState,db

logging.pattern.correlation=[%X{correlationId:-}]

# Sem "manter conectado", a sessao vale o padrao de spring.session.timeout. O maximo vale mesmo com uso continuo.
readowl.sessions.remembered-idle=14d
readowl.sessions.max-age=30d
readowl.sessions.privileged-idle=1h
readowl.sessions.privileged-max-age=12h
# Trocar papeis e, em contas sem senha, excluir a conta ou trocar o e-mail exigem um login recente.
readowl.sessions.recent-login=15m
# Em producao, contas com papel de moderacao ou administracao so entram pelo Google (perfil prod).
readowl.privileged-google-login-required=false

# Mudar a versao faz todas as contas aceitarem de novo. Texto e idade dependem de revisao juridica.
readowl.terms.version=2026-11
readowl.terms.minimum-age=18

# Armazenamento compativel com S3, so para fotos de perfil. Sem S3_BUCKET, o envio de fotos responde 503.
# S3_PUBLIC_URL e o endereco publico do bucket ou da CDN. S3_ENDPOINT fica vazio na AWS.
readowl.storage.endpoint=${S3_ENDPOINT:}
readowl.storage.region=${S3_REGION:}
readowl.storage.bucket=${S3_BUCKET:}
readowl.storage.access-key=${S3_ACCESS_KEY:}
readowl.storage.secret-key=${S3_SECRET_KEY:}
readowl.storage.public-url=${S3_PUBLIC_URL:}

# Prazos de docs/personal-data.md. Auditoria e registros de acesso tem um minimo no banco (V14).
readowl.retention.unverified-accounts=7d
readowl.retention.notifications=365d
readowl.retention.deleted-comment-text=30d
readowl.retention.closed-reports=365d
readowl.retention.audit-log=730d
readowl.retention.access-records=183d
