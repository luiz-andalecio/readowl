# Os cabecalhos X-Forwarded-* so valem para conexoes vindas do proxy. Expressao regular, sem valor padrao de proposito.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES}
server.servlet.session.cookie.name=__Host-SESSION
readowl.csrf-cookie-name=__Host-XSRF-TOKEN

logging.structured.format.console=ecs

# As migrations rodam antes, com outro usuario (ver DatabaseMigration). A aplicacao so confere o schema.
spring.flyway.enabled=false

# Exige o Google configurado (GOOGLE_CLIENT_ID): sem ele, nenhuma conta privilegiada consegue entrar.
readowl.privileged-google-login-required=${PRIVILEGED_GOOGLE_LOGIN_REQUIRED:true}

# Porta interna, que o Compose nao publica e o proxy nao encaminha. Na porta publica ficam so /readyz e /livez, sem detalhes.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.add-additional-paths=true
